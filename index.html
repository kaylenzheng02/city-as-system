<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
      A gym, by smell — study 01
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&amp;display=swap">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <section aria-label="Interactive gym map">
        <div class="toolbar">
          <button
            class="toggle"
            id="toggle"
            type="button"
            aria-label="Open floors side by side"
            title="Open floors side by side"
            aria-expanded="false"
            aria-controls="stage"
          >
            click
          </button>
        </div>
        <div class="stage" id="stage">
          <div class="floor" data-floor="entrance" aria-label="Entrance level">
            <div class="room front-desk">
              Front desk
            </div>
            <div class="room entrance-stairs">
              Stairs ↓
            </div>
            <div class="room lobby">
              Entrance / lobby
            </div>
            <button class="dot" data-spot="desk" aria-label="Smell at the front desk">
            </button>
            <span class="floor-title">
              00 / MAIN ENTRANCE
            </span>
          </div>
          <div class="floor" data-floor="climbing" aria-label="Climbing level">
            <div class="room cave">
              The cave
            </div>
            <div class="room climbing-stairs">
              Stairs
            </div>
            <div class="room climbing-area">
              Climbing area
            </div>
            <button class="dot" data-spot="cave" aria-label="Smell in the cave">
            </button>
            <button class="dot" data-spot="climbing" aria-label="Smell in the climbing area">
            </button>
            <span class="floor-title">
              01 / CLIMBING LEVEL
            </span>
          </div>
          <div class="floor" data-floor="basement" aria-label="Basement">
            <div class="room yoga-room">
              Yoga room
            </div>
            <div class="room bathroom">
              Bathroom
            </div>
            <div class="room basement-gym">
              Gym / shared space
            </div>
            <button class="dot" data-spot="yoga" aria-label="Smell in the yoga room">
            </button>
            <button class="dot" data-spot="bathroom" aria-label="Smell in the bathroom">
            </button>
            <button class="dot" data-spot="gym" aria-label="Smell in the basement gym">
            </button>
            <span class="floor-title">
              02 / BASEMENT
            </span>
          </div>
        </div>
      </section>
      <aside>
        <div class="visit-controls">
          <label for="visit" class="eyebrow">
            01 / Choose a visit
          </label>
          <select id="visit">
          </select>
        </div>
        <div class="note" aria-live="polite" aria-atomic="true">
          <div class="eyebrow">
            02 / A smell, somewhere
          </div>
          <h2 id="spot-title">
            Explore a little.
          </h2>
          <blockquote id="description">
            Open the floors, then hover over a dot.
          </blockquote>
        </div>
        <div class="legend">
          <span class="swatch">
          </span>
          A recorded observation
        </div>
      </aside>
    </main>
    <script src="script.js">
    </script>
  </body>
</html>
